<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titanic Survival Predictor</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:2rem}
  .card{max-width:480px;margin:auto;background:#1e293b;padding:1.5rem 2rem;border-radius:12px}
  h1{margin-top:0;font-size:1.4rem}
  label{display:block;margin:.8rem 0 .2rem;font-size:.85rem;color:#94a3b8}
  input,select{width:100%;padding:.55rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;box-sizing:border-box}
  button{margin-top:1.2rem;width:100%;padding:.7rem;border:0;border-radius:6px;background:#38bdf8;color:#0f172a;font-weight:600;cursor:pointer}
  #result{margin-top:1.2rem;padding:1rem;border-radius:8px;display:none;text-align:center;font-size:1.1rem}
  .ok{background:#14532d}.no{background:#7f1d1d}
</style>
</head>
<body>
<div class="card">
  <h1>🚢 Titanic Survival Predictor</h1>
  <label>Passenger class</label>
  <select id="Pclass"><option value="1">1st</option><option value="2">2nd</option><option value="3" selected>3rd</option></select>
  <label>Name (optional, title like Mr/Mrs/Miss is used)</label>
  <input id="Name" placeholder="Smith, Mr. John">
  <label>Sex</label>
  <select id="Sex"><option value="male">Male</option><option value="female">Female</option></select>
  <label>Age</label><input id="Age" type="number" step="any" placeholder="e.g. 28">
  <label>Siblings / spouses aboard</label><input id="SibSp" type="number" value="0" min="0">
  <label>Parents / children aboard</label><input id="Parch" type="number" value="0" min="0">
  <label>Fare</label><input id="Fare" type="number" step="any" placeholder="e.g. 32.2">
  <label>Embarked</label>
  <select id="Embarked"><option value="S">Southampton</option><option value="C">Cherbourg</option><option value="Q">Queenstown</option></select>
  <button onclick="predict()">Predict</button>
  <div id="result"></div>
</div>
<script>
async function predict(){
  const ids=["Pclass","Name","Sex","Age","SibSp","Parch","Fare","Embarked"];
  const body={}; ids.forEach(i=>body[i]=document.getElementById(i).value);
  const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json(), el=document.getElementById("result");
  el.style.display="block";
  if(!r.ok){el.className="no";el.textContent=d.error;return}
  el.className=d.survived?"ok":"no";
  el.textContent=(d.survived?"Likely survived":"Likely did not survive")+" ("+(d.probability*100).toFixed(1)+"% survival probability)";
}
</script>
</body>
</html>
